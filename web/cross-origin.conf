# Página isolada de outras origens: é o que libera o SharedArrayBuffer, de que o SQLite em WebAssembly
# do navegador (o banco local do treino) precisa. "credentialless" deixa passar as imagens de outras
# origens (as fotos de /files da API) sem exigir Cross-Origin-Resource-Policy em tudo.
# O nginx não herda add_header do server para um location que tenha o seu: por isso este arquivo é
# incluído em cada bloco.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
